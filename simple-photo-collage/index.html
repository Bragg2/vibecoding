<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>PHOTO COLLAGE ART</title>
    <style>
        :root {
            --bg-color: #000000;
            --sidebar-bg: #0a0a0a;
            --text-color: #ffffff;
            --border-color: #222222;
            --font-main: "PingFang SC", "Heiti SC", "Microsoft YaHei", sans-serif;
            --font-mono: "IBM Plex Mono", Consolas, monospace;
        }

        * { box-sizing: border-box; }
        body {
            margin: 0; padding: 0;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: var(--font-main);
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        #sidebar {
            width: 320px;
            background: var(--sidebar-bg);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            padding: 30px 25px;
            overflow-y: auto;
            flex-shrink: 0;
        }

        .header-title {
            font-family: var(--font-mono);
            font-size: 26px;
            font-weight: 900;
            margin-bottom: 40px;
            letter-spacing: -1px;
            line-height: 1.1;
            text-transform: uppercase;
        }

        .menu-section { margin-bottom: 30px; }
        .menu-label {
            font-weight: bold;
            color: #555;
            margin-bottom: 15px;
            display: block;
            font-size: 10px;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .control-item { margin-bottom: 20px; }
        .label-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-size: 12px;
            color: #aaa;
        }

        input[type="range"] {
            -webkit-appearance: none;
            width: 100%;
            height: 2px;
            background: #333;
            outline: none;
            margin: 10px 0;
        }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 10px; height: 10px;
            background: #fff;
            cursor: pointer;
            border-radius: 0;
        }

        .mode-tabs {
            display: flex;
            margin-bottom: 18px;
            border: 1px solid #333;
        }
        .mode-tab {
            flex: 1;
            padding: 9px 6px;
            font-size: 10px;
            font-family: var(--font-mono);
            letter-spacing: 1px;
            text-align: center;
            cursor: pointer;
            background: #000;
            color: #555;
            border: none;
            text-transform: uppercase;
            transition: all 0.2s;
        }
        .mode-tab.active { background: #fff; color: #000; font-weight: bold; }
        .mode-tab:not(.active):hover { color: #ccc; }

        .upload-area {
            border: 1px solid #333;
            padding: 25px 15px;
            text-align: center;
            background: #000;
            cursor: pointer;
            transition: border-color 0.3s;
            margin-bottom: 10px;
        }
        .upload-area:hover { border-color: #fff; }
        .upload-area.loaded { border-color: #666; }
        .upload-tip { font-size: 11px; color: #555; margin-top: 10px; }

        #mode-single { display: none; }

        .color-row {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-top: 12px;
        }
        .color-label { font-size: 12px; color: #aaa; }
        input[type="color"] {
            -webkit-appearance: none;
            width: 40px; height: 24px;
            border: 1px solid #444;
            padding: 2px;
            background: #000;
            cursor: pointer;
            border-radius: 0;
        }
        input[type="color"]::-webkit-color-swatch-wrapper { padding: 0; }
        input[type="color"]::-webkit-color-swatch { border: none; }

        .thumb-row { display: flex; gap: 8px; margin-top: 10px; }
        .thumb-box {
            flex: 1; height: 50px;
            border: 1px solid #333;
            overflow: hidden;
            position: relative;
        }
        .thumb-box img { width: 100%; height: 100%; object-fit: cover; display: block; }
        .thumb-box .thumb-label {
            position: absolute; bottom: 2px; left: 4px;
            font-size: 9px; color: #fff;
            font-family: var(--font-mono);
            text-shadow: 0 0 4px #000;
        }
        .thumb-box.color-thumb { display: flex; align-items: center; justify-content: center; }

        .checkbox-group {
            display: flex;
            align-items: center;
            cursor: pointer;
            margin-bottom: 10px;
            font-size: 12px;
            color: #ccc;
        }
        .checkbox-group input { margin-right: 10px; accent-color: #fff; }

        #swap-hint {
            display: none;
            background: #0d0d0d;
            border: 1px solid #2a2a2a;
            padding: 10px 12px;
            font-size: 11px;
            color: #666;
            line-height: 1.7;
            margin-top: 4px;
        }
        #swap-hint b { color: #999; }

        #preview-container {
            flex-grow: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px;
            background-image: radial-gradient(#151515 1px, transparent 1px);
            background-size: 25px 25px;
            overflow: hidden;
            position: relative;
        }

        #mainCanvas {
            max-width: 100%;
            max-height: 100%;
            background: #000;
            box-shadow: 0 0 60px rgba(0,0,0,0.8);
            display: block;
            position: relative;
            z-index: 1;
        }

        #swap-overlay-svg {
            position: absolute;
            pointer-events: none;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 2;
        }

        .btn-secondary {
            background: #111; border: 1px solid #444; color: #ccc;
            padding: 8px; width: 100%; cursor: pointer;
            font-size: 11px; letter-spacing: 1px;
            margin-top: 10px;
        }
        .btn-secondary:hover { background: #222; color: #fff; }

        .export-btn {
            background: #fff; color: #000; border: none;
            padding: 15px; margin-top: auto; cursor: pointer;
            font-weight: bold; font-size: 12px;
            letter-spacing: 2px; text-transform: uppercase; width: 100%;
        }
        .export-btn:hover { background: #ccc; }
    </style>
</head>
<body>

<div id="sidebar">
    <div class="header-title">PHOTO<br>COLLAGE ART</div>

    <div class="menu-section">
        <span class="menu-label">/ 媒体上传</span>
        <div class="mode-tabs">
            <button class="mode-tab active" id="tab-double" onclick="switchMediaMode('double')">双图模式</button>
            <button class="mode-tab" id="tab-single" onclick="switchMediaMode('single')">单图+底色</button>
        </div>

        <div id="mode-double">
            <div class="upload-area" id="upload-double" onclick="document.getElementById('imgInputDouble').click()">
                <div style="font-size:13px;font-weight:bold;">上传 2 张照片</div>
                <div class="upload-tip">请在文件夹中同时选中两张图</div>
                <input type="file" id="imgInputDouble" accept="image/*" multiple style="display:none">
            </div>
            <div class="thumb-row" id="thumb-double" style="display:none">
                <div class="thumb-box" id="thumb-a"><span class="thumb-label">A</span></div>
                <div class="thumb-box" id="thumb-b"><span class="thumb-label">B</span></div>
            </div>
        </div>

        <div id="mode-single">
            <div class="upload-area" id="upload-single" onclick="document.getElementById('imgInputSingle').click()">
                <div style="font-size:13px;font-weight:bold;">上传 1 张照片</div>
                <div class="upload-tip">另一张将以纯色底图替代</div>
                <input type="file" id="imgInputSingle" accept="image/*" style="display:none">
            </div>
            <div class="color-row">
                <span class="color-label">底图颜色</span>
                <input type="color" id="bgColor" value="#ffffff">
                <span style="font-size:11px;color:#555;font-family:var(--font-mono);" id="bgColorHex">#ffffff</span>
            </div>
            <div class="thumb-row" id="thumb-single" style="display:none">
                <div class="thumb-box" id="thumb-single-img"><span class="thumb-label">照片</span></div>
                <div class="thumb-box color-thumb" id="thumb-single-color"><span class="thumb-label">底色</span></div>
            </div>
        </div>
    </div>

    <div class="menu-section">
        <span class="menu-label">/ 裁切模式</span>
        <div class="mode-tabs">
            <button class="mode-tab active" id="tab-grid-std" onclick="switchGridMode('standard')">标准等距</button>
            <button class="mode-tab" id="tab-grid-irr" onclick="switchGridMode('irregular')">错位斜纹</button>
        </div>
        <button id="btn-regen" class="btn-secondary" style="display:none;" onclick="forceRegenGrid()">随机生成扭曲度</button>
    </div>

    <div class="menu-section">
        <span class="menu-label">/ 裁切密度</span>
        <div class="control-item">
            <div class="label-row"><span>经向分割 (纵)</span><span id="val-cols">12</span></div>
            <input type="range" id="cols" min="2" max="60" value="12">
        </div>
        <div class="control-item">
            <div class="label-row"><span>纬向分割 (横)</span><span id="val-rows">12</span></div>
            <input type="range" id="rows" min="2" max="60" value="12">
        </div>
    </div>

    <div class="menu-section">
        <span class="menu-label">/ 交换模式</span>
        <label class="checkbox-group">
            <input type="checkbox" id="enableSwap"> 开启格子交换
        </label>
        <div id="swap-hint">
            点击<b>第一个格子</b>选中（橙色高亮），<br>
            再点击另一个格子完成<b>位置交换</b>。
        </div>
    </div>

    <div class="menu-section">
        <span class="menu-label">/ 背景与布局</span>
        <label class="checkbox-group">
            <input type="checkbox" id="enableLayout"> 开启背景空间
        </label>
        <div id="layout-controls" style="display:none; padding-top: 5px;">
            <div class="color-row" style="margin-bottom: 15px;">
                <span class="color-label">空间颜色</span>
                <input type="color" id="layoutColor" value="#ffcc00">
            </div>
            <div class="control-item">
                <div class="label-row"><span>主体缩放</span><span id="val-scale">50%</span></div>
                <input type="range" id="layoutScale" min="10" max="100" value="50">
            </div>
            <div class="control-item">
                <div class="label-row"><span>水平偏移</span><span id="val-panx">0</span></div>
                <input type="range" id="layoutPanX" min="-500" max="500" value="0">
            </div>
            <div class="control-item">
                <div class="label-row"><span>垂直偏移</span><span id="val-pany">0</span></div>
                <input type="range" id="layoutPanY" min="-500" max="500" value="0">
            </div>
        </div>
    </div>

    <div class="menu-section">
        <span class="menu-label">/ 细节渲染</span>
        <div class="control-item">
            <div class="label-row"><span>交汇阴影线强度</span><span id="val-depth">50</span></div>
            <input type="range" id="depthStrength" min="0" max="100" value="50">
        </div>
    </div>

    <div class="menu-section">
        <span class="menu-label">/ 艺术滤镜</span>
        <div class="control-item">
            <div class="label-row"><span>经典黑白强度</span><span id="val-bw">0</span></div>
            <input type="range" id="bwStrength" min="0" max="100" value="0">
        </div>
        <div class="control-item">
            <div class="label-row"><span>半调网点 (Halftone)</span><span id="val-ht">0</span></div>
            <input type="range" id="htStrength" min="0" max="100" value="0">
        </div>
        <div class="control-item">
            <div class="label-row"><span>低像素模糊 (Lo-Fi)</span><span id="val-px">0</span></div>
            <input type="range" id="pxStrength" min="0" max="100" value="0">
        </div>
    </div>

    <button class="export-btn" id="downloadBtn">保存拼贴作品</button>
</div>

<div id="preview-container">
    <canvas id="mainCanvas"></canvas>
    <svg id="swap-overlay-svg" xmlns="http://www.w3.org/2000/svg"></svg>
</div>

<script>
    const canvas      = document.getElementById('mainCanvas');
    const ctx         = canvas.getContext('2d');
    const overlaySvg  = document.getElementById('swap-overlay-svg');

    const colsInput   = document.getElementById('cols');
    const rowsInput   = document.getElementById('rows');
    const enableSwap  = document.getElementById('enableSwap');
    
    const depthInput  = document.getElementById('depthStrength');
    const bwInput     = document.getElementById('bwStrength');
    const htInput     = document.getElementById('htStrength');
    const pxInput     = document.getElementById('pxStrength'); 
    
    // Layout Controls
    const enableLayout = document.getElementById('enableLayout');
    const layoutControls = document.getElementById('layout-controls');
    const layoutColor = document.getElementById('layoutColor');
    const layoutScale = document.getElementById('layoutScale');
    const layoutPanX  = document.getElementById('layoutPanX');
    const layoutPanY  = document.getElementById('layoutPanY');

    const imgA = new Image();
    const imgB = new Image();
    let imgALoaded = false;
    let imgBLoaded = false;

    let currentMediaMode = 'double';
    let currentGridMode  = 'standard';
    
    let cellStates   = [];
    let gridPoints   = []; 
    let needsGridUpdate = true;
    let swapSelected = null;

    function isReady() { return imgALoaded && imgBLoaded; }

    // ── 模式切换 ──────────────────────────────────────────
    window.switchMediaMode = function(mode) {
        currentMediaMode = mode;
        document.getElementById('mode-double').style.display = mode === 'double' ? 'block' : 'none';
        document.getElementById('mode-single').style.display = mode === 'single' ? 'block' : 'none';
        document.getElementById('tab-double').classList.toggle('active', mode === 'double');
        document.getElementById('tab-single').classList.toggle('active', mode === 'single');
        imgALoaded = imgBLoaded = false;
        swapSelected = null;
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        clearOverlay();
    };

    window.switchGridMode = function(mode) {
        currentGridMode = mode;
        document.getElementById('tab-grid-std').classList.toggle('active', mode === 'standard');
        document.getElementById('tab-grid-irr').classList.toggle('active', mode === 'irregular');
        document.getElementById('btn-regen').style.display = mode === 'irregular' ? 'block' : 'none';
        forceRegenGrid();
    };

    window.forceRegenGrid = function() {
        needsGridUpdate = true;
        swapSelected = null;
        clearOverlay();
        render();
    };

    // ── 上传逻辑 ──────────────────────────────────────────
    document.getElementById('imgInputDouble').onchange = function(e) {
        const files = e.target.files;
        if (files.length !== 2) { alert('请确保同时选中 2 张图片！'); return; }
        imgALoaded = imgBLoaded = false;
        function loadOne(file, imgObj, thumbId, flagSetter) {
            const reader = new FileReader();
            reader.onload = function(ev) {
                imgObj.onload = function() {
                    setThumbSrc(thumbId, ev.target.result);
                    flagSetter(true);
                    if (isReady()) onBothLoaded();
                };
                imgObj.src = ev.target.result;
            };
            reader.readAsDataURL(file);
        }
        loadOne(files[0], imgA, 'thumb-a', v => imgALoaded = v);
        loadOne(files[1], imgB, 'thumb-b', v => imgBLoaded = v);
        document.getElementById('thumb-double').style.display = 'flex';
        document.getElementById('upload-double').classList.add('loaded');
    };

    document.getElementById('imgInputSingle').onchange = function(e) {
        const file = e.target.files[0];
        if (!file) return;
        imgALoaded = imgBLoaded = false;
        const reader = new FileReader();
        reader.onload = function(ev) {
            imgA.onload = function() {
                imgALoaded = true;
                setThumbSrc('thumb-single-img', ev.target.result);
                buildColorImageB(() => { imgBLoaded = true; onBothLoaded(); });
            };
            imgA.src = ev.target.result;
        };
        reader.readAsDataURL(file);
        document.getElementById('thumb-single').style.display = 'flex';
        document.getElementById('upload-single').classList.add('loaded');
    };

    document.getElementById('bgColor').oninput = function() {
        document.getElementById('bgColorHex').textContent = this.value;
        document.getElementById('thumb-single-color').style.background = this.value;
        if (currentMediaMode === 'single' && imgALoaded) {
            buildColorImageB(() => render());
        }
    };

    function buildColorImageB(cb) {
        const w = imgA.naturalWidth || 800, h = imgA.naturalHeight || 800;
        const tmp = document.createElement('canvas');
        tmp.width = w; tmp.height = h;
        const tCtx = tmp.getContext('2d');
        tCtx.fillStyle = document.getElementById('bgColor').value;
        tCtx.fillRect(0, 0, w, h);
        imgB.onload = () => { if(cb) cb(); };
        imgB.src = tmp.toDataURL();
    }

    function setThumbSrc(id, src) {
        const box = document.getElementById(id);
        let img = box.querySelector('img');
        if (!img) { img = document.createElement('img'); box.appendChild(img); }
        img.src = src;
    }

    function onBothLoaded() {
        needsGridUpdate = true;
        swapSelected = null;
        clearOverlay();
        render();
    }

    // ── 交互监听 ──────────────────────────────────────────
    [colsInput, rowsInput].forEach(el => el.addEventListener('input', function() {
        document.getElementById('val-' + this.id).innerText = this.value;
        needsGridUpdate = true;
        swapSelected = null;
        clearOverlay();
        render();
    }));

    // 统一 UI Label 更新
    [depthInput, bwInput, htInput, pxInput, layoutScale, layoutPanX, layoutPanY, layoutColor].forEach(el => el.addEventListener('input', function() {
        let labelId = 'val-' + this.id.replace('Strength','').replace('layout','').toLowerCase();
        let labelEl = document.getElementById(labelId);
        if(labelEl) {
            labelEl.innerText = this.id.includes('Scale') ? this.value + '%' : this.value;
        }
        render();
    }));

    enableLayout.onchange = function() {
        layoutControls.style.display = this.checked ? 'block' : 'none';
        render();
    };

    enableSwap.onchange = function() {
        document.getElementById('swap-hint').style.display = (this.checked && isReady()) ? 'block' : 'none';
        if (!this.checked) { swapSelected = null; clearOverlay(); }
        canvas.style.cursor = (this.checked && isReady()) ? 'crosshair' : 'default';
    };

    // ── 核心：网格生成与几何相交 ──────────────────────────────
    function updateGridGeometry(W, H) {
        const cols = parseInt(colsInput.value);
        const rows = parseInt(rowsInput.value);
        
        if (cellStates.length !== rows || !cellStates[0] || cellStates[0].length !== cols) {
            cellStates = [];
            for (let r = 0; r < rows; r++) {
                cellStates[r] = [];
                for (let c = 0; c < cols; c++) {
                    cellStates[r][c] = (r + c) % 2 === 0 ? 0 : 1;
                }
            }
        }

        gridPoints = [];
        let topX = [], bottomX = [], leftY = [], rightY = [];

        if (currentGridMode === 'standard') {
            for(let c=0; c<=cols; c++) { topX[c] = c*(W/cols); bottomX[c] = c*(W/cols); }
            for(let r=0; r<=rows; r++) { leftY[r] = r*(H/rows); rightY[r] = r*(H/rows); }
        } else {
            let jitterX = (W/cols) * 0.45;
            let jitterY = (H/rows) * 0.45;
            for(let c=0; c<=cols; c++) {
                if(c===0) { topX[c]=0; bottomX[c]=0; }
                else if(c===cols) { topX[c]=W; bottomX[c]=W; }
                else {
                    topX[c] = c*(W/cols) + (Math.random()*2-1)*jitterX;
                    bottomX[c] = c*(W/cols) + (Math.random()*2-1)*jitterX;
                }
            }
            for(let r=0; r<=rows; r++) {
                if(r===0) { leftY[r]=0; rightY[r]=0; }
                else if(r===rows) { leftY[r]=H; rightY[r]=H; }
                else {
                    leftY[r] = r*(H/rows) + (Math.random()*2-1)*jitterY;
                    rightY[r] = r*(H/rows) + (Math.random()*2-1)*jitterY;
                }
            }
        }

        for(let r=0; r<=rows; r++) {
            gridPoints[r] = [];
            for(let c=0; c<=cols; c++) {
                let x1 = topX[c], y1 = 0, x2 = bottomX[c], y2 = H;
                let x3 = 0, y3 = leftY[r], x4 = W, y4 = rightY[r];
                let D = (x1-x2)*(y3-y4) - (y1-y2)*(x3-x4);
                if (D === 0) {
                    gridPoints[r][c] = {x: x1, y: y3}; 
                } else {
                    let t = ((x1-x3)*(y3-y4) - (y1-y3)*(x3-x4))/D;
                    gridPoints[r][c] = { x: x1 + t*(x2-x1), y: y1 + t*(y2-y1) };
                }
            }
        }
        needsGridUpdate = false;
    }

    // ── 画布点击与逆向射线测试 ────────────────────────────────
    canvas.addEventListener('click', function(e) {
        if (!enableSwap.checked || !isReady()) return;

        var rect = canvas.getBoundingClientRect();
        var scaleX = canvas.width / rect.width;
        var scaleY = canvas.height / rect.height;
        var mx = (e.clientX - rect.left) * scaleX;
        var my = (e.clientY - rect.top)  * scaleY;

        if (enableLayout.checked) {
            let sc = parseInt(layoutScale.value) / 100;
            let px = parseInt(layoutPanX.value);
            let py = parseInt(layoutPanY.value);
            mx = (mx - (canvas.width/2 + px)) / sc + canvas.width/2;
            my = (my - (canvas.height/2 + py)) / sc + canvas.height/2;
        }

        let clickedR = -1, clickedC = -1;
        const rows = parseInt(rowsInput.value);
        const cols = parseInt(colsInput.value);

        for (let r = 0; r < rows; r++) {
            for (let c = 0; c < cols; c++) {
                let poly = [ gridPoints[r][c], gridPoints[r][c+1], gridPoints[r+1][c+1], gridPoints[r+1][c] ];
                let inside = false;
                for (let i = 0, j = 3; i < 4; j = i++) {
                    let xi = poly[i].x, yi = poly[i].y;
                    let xj = poly[j].x, yj = poly[j].y;
                    if (((yi > my) != (yj > my)) && (mx < (xj - xi) * (my - yi) / (yj - yi) + xi)) inside = !inside;
                }
                if (inside) { clickedR = r; clickedC = c; break; }
            }
            if (clickedR !== -1) break;
        }

        if (clickedR === -1) return; 

        if (!swapSelected) {
            swapSelected = { r: clickedR, c: clickedC };
            drawOverlay();
        } else if (swapSelected.r === clickedR && swapSelected.c === clickedC) {
            swapSelected = null;
            clearOverlay();
        } else {
            let tmp = cellStates[swapSelected.r][swapSelected.c];
            cellStates[swapSelected.r][swapSelected.c] = cellStates[clickedR][clickedC];
            cellStates[clickedR][clickedC] = tmp;
            swapSelected = null;
            clearOverlay();
            render();
        }
    });

    function drawOverlay() {
        clearOverlay();
        if (!swapSelected) return;

        let r = swapSelected.r, c = swapSelected.c;
        let poly = [ gridPoints[r][c], gridPoints[r][c+1], gridPoints[r+1][c+1], gridPoints[r+1][c] ];

        var canvasRect = canvas.getBoundingClientRect();
        var containerRect = document.getElementById('preview-container').getBoundingClientRect();
        var offX = canvasRect.left - containerRect.left;
        var offY = canvasRect.top  - containerRect.top;
        var scaleX = canvasRect.width / canvas.width;
        var scaleY = canvasRect.height / canvas.height;

        let el = document.createElementNS('http://www.w3.org/2000/svg', 'polygon');
        let ptsStr = poly.map(pt => {
            let x = pt.x, y = pt.y;
            if (enableLayout.checked) {
                let sc = parseInt(layoutScale.value) / 100;
                let px = parseInt(layoutPanX.value), py = parseInt(layoutPanY.value);
                x = (x - canvas.width/2) * sc + canvas.width/2 + px;
                y = (y - canvas.height/2) * sc + canvas.height/2 + py;
            }
            return `${offX + x * scaleX},${offY + y * scaleY}`;
        }).join(" ");
        
        el.setAttribute('points', ptsStr);
        el.setAttribute('fill', 'rgba(255,140,0,0.25)');
        el.setAttribute('stroke', 'rgba(255,165,0,0.95)');
        el.setAttribute('stroke-width', '2');
        overlaySvg.appendChild(el);
    }

    function clearOverlay() {
        while (overlaySvg.firstChild) overlaySvg.removeChild(overlaySvg.firstChild);
    }

    // ── 主渲染双层管线 (解耦滤镜与背景) ────────────────────────
    function render() {
        if (!isReady()) return;
        var natW = imgA.naturalWidth, natH = imgA.naturalHeight;
        if (!natW || !natH) return;

        var W = 1000;
        canvas.width = W;
        canvas.height = Math.round(W * natH / natW);

        if (needsGridUpdate) updateGridGeometry(canvas.width, canvas.height);

        const cols = parseInt(colsInput.value);
        const rows = parseInt(rowsInput.value);

        var offCanvas = document.createElement('canvas');
        offCanvas.width = canvas.width;
        offCanvas.height = canvas.height;
        var oCtx = offCanvas.getContext('2d', { willReadFrequently: true });

        oCtx.fillStyle = '#000';
        oCtx.fillRect(0, 0, offCanvas.width, offCanvas.height);

        for (let r = 0; r < rows; r++) {
            for (let c = 0; c < cols; c++) {
                let isA = cellStates[r][c] === 0;
                let src = isA ? imgA : imgB;
                let poly = [ gridPoints[r][c], gridPoints[r][c+1], gridPoints[r+1][c+1], gridPoints[r+1][c] ];

                oCtx.save();
                oCtx.beginPath();
                oCtx.moveTo(poly[0].x, poly[0].y);
                oCtx.lineTo(poly[1].x, poly[1].y);
                oCtx.lineTo(poly[2].x, poly[2].y);
                oCtx.lineTo(poly[3].x, poly[3].y);
                oCtx.closePath();
                
                oCtx.lineWidth = 1; 
                oCtx.strokeStyle = isA ? "rgba(0,0,0,0.01)" : "rgba(255,255,255,0.01)";
                oCtx.stroke();

                oCtx.clip();
                oCtx.drawImage(src, 0, 0, offCanvas.width, offCanvas.height);
                oCtx.restore();
            }
        }

        // ── 将 UI 的 0-100 平滑映射到 0-0.1 的物理权重 ──
        // 这样滑块在 100 时效果等同于之前的 10，滑块在 50 时效果等同于之前的 5
        let shadowVal = (parseInt(depthInput.value) / 100) * 0.1; 
        
        if (shadowVal > 0) {
            oCtx.lineWidth = Math.max(1, offCanvas.width / 400);
            for (let r = 0; r < rows; r++) {
                for (let c = 0; c < cols; c++) {
                    let isA = cellStates[r][c] === 0;
                    let p1 = gridPoints[r][c], p2 = gridPoints[r][c+1];
                    let p3 = gridPoints[r+1][c+1], p4 = gridPoints[r+1][c];

                    oCtx.shadowColor = `rgba(0,0,0,${shadowVal * 1.5})`;
                    oCtx.shadowBlur = 80 * shadowVal; // 调整模糊度比例以匹配原版视觉
                    oCtx.strokeStyle = `rgba(0,0,0,${shadowVal})`;

                    oCtx.beginPath();
                    if (isA) { 
                        oCtx.moveTo(p1.x, p1.y); oCtx.lineTo(p4.x, p4.y);
                        oCtx.moveTo(p2.x, p2.y); oCtx.lineTo(p3.x, p3.y);
                    } else {   
                        oCtx.moveTo(p1.x, p1.y); oCtx.lineTo(p2.x, p2.y);
                        oCtx.moveTo(p4.x, p4.y); oCtx.lineTo(p3.x, p3.y);
                    }
                    oCtx.stroke();
                }
            }
            oCtx.shadowBlur = 0; 
        }

        applyFilters(oCtx, offCanvas);

        if (enableLayout.checked) {
            ctx.fillStyle = layoutColor.value;
            ctx.fillRect(0, 0, canvas.width, canvas.height);
        } else {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
        }

        ctx.save();
        if (enableLayout.checked) {
            let sc = parseInt(layoutScale.value) / 100;
            let px = parseInt(layoutPanX.value);
            let py = parseInt(layoutPanY.value);
            ctx.translate(canvas.width/2 + px, canvas.height/2 + py);
            ctx.scale(sc, sc);
            ctx.translate(-canvas.width/2, -canvas.height/2);
        }

        ctx.drawImage(offCanvas, 0, 0);
        ctx.restore();

        if (swapSelected && enableSwap.checked) drawOverlay();
    }

    // ── 滤镜 (仅针对传入的 Canvas 对象) ─────────────────────────
    function applyFilters(targetCtx, targetCanvas) {
        var bwS = parseInt(bwInput.value) / 100;
        var htS = parseInt(htInput.value) / 100;
        var pxS = parseInt(pxInput.value) / 100;

        if (pxS > 0) {
            var tmp   = document.createElement('canvas');
            var scale = Math.max(0.05, 1 - pxS * 0.95);
            tmp.width  = Math.max(1, Math.round(targetCanvas.width  * scale));
            tmp.height = Math.max(1, Math.round(targetCanvas.height * scale));
            tmp.getContext('2d').drawImage(targetCanvas, 0, 0, tmp.width, tmp.height);
            targetCtx.filter = 'blur(' + (pxS * 10) + 'px)';
            targetCtx.drawImage(tmp, 0, 0, tmp.width, tmp.height, 0, 0, targetCanvas.width, targetCanvas.height);
            targetCtx.filter = 'none';
        }

        var imageData = targetCtx.getImageData(0, 0, targetCanvas.width, targetCanvas.height);
        var data = imageData.data;

        if (htS > 0) {
            targetCtx.fillStyle = '#fff';
            targetCtx.fillRect(0, 0, targetCanvas.width, targetCanvas.height);
            var step = Math.floor(5 + (1 - htS) * 12);
            for (var y = 0; y < targetCanvas.height; y += step) {
                for (var x = 0; x < targetCanvas.width; x += step) {
                    var i = (y * targetCanvas.width + x) * 4;
                    var gray = (data[i] * 0.299 + data[i+1] * 0.587 + data[i+2] * 0.114) / 255;
                    var radius = (step / 2) * (1 - gray) * 1.3;
                    targetCtx.fillStyle = '#000';
                    targetCtx.beginPath();
                    targetCtx.arc(x, y, radius, 0, Math.PI * 2);
                    targetCtx.fill();
                }
            }
            imageData = targetCtx.getImageData(0, 0, targetCanvas.width, targetCanvas.height);
            data = imageData.data;
        }

        if (bwS > 0) {
            for (var i = 0; i < data.length; i += 4) {
                var r2 = data[i], g2 = data[i+1], b2 = data[i+2];
                var gr = r2 * 0.299 + g2 * 0.587 + b2 * 0.114;
                gr = (gr - 128) * 1.3 + 128;
                data[i]   = r2 * (1 - bwS) + gr * bwS;
                data[i+1] = g2 * (1 - bwS) + gr * bwS;
                data[i+2] = b2 * (1 - bwS) + gr * bwS;
            }
            targetCtx.putImageData(imageData, 0, 0);
        }
    }

    // ── 导出 ──────────────────────────────────────────────
    document.getElementById('downloadBtn').onclick = function() {
        var link = document.createElement('a');
        link.download = 'woven_art_collage.png';
        link.href = canvas.toDataURL('image/png', 1.0);
        link.click();
    };
</script>
</body>
